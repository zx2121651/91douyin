server:
  port: 8080
  address: "0.0.0.0"
  max_request_size: 104857600 # 100MB

database:
  driver: "sqlite"
  dsn: "data/douyin.db"

jwt:
  secret: "" # Use DOUYIN_JWT_SECRET env var
  expire_hours: 168

storage:
  type: "local" # local or oss
  local:
    video_path: "public/videos"
    cover_path: "public/covers"
    avatar_path: "public/avatars"
    background_path: "public/backgrounds"
    domain: "10.0.2.2:8080"
  oss:
    endpoint: ""
    access_key_id: ""
    access_key_secret: ""
    bucket_name: ""
